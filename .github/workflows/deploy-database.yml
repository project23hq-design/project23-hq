# On every push to main: apply new database migrations to the production Supabase
# project, then make sure the super-admin account(s) exist. Safe to re-run: `db push`
# only applies migrations the database hasn't seen, and provisioning is idempotent.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN      supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF       the id in the dashboard URL (e.g. hcwhtgftvwmjhnrbixxj)
#   SUPABASE_DB_PASSWORD       the database password chosen when the project was created
#   SUPABASE_SERVICE_ROLE_KEY  Project Settings → API → service_role
#   SUPER_ADMIN_EMAIL          the admin's email (comma-separate several)
#   NETLIFY_BUILD_HOOK         optional: Netlify build hook URL, to deploy after migrating

name: Deploy database

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          pnpm exec supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Provision super-admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
        run: pnpm admin:provision

      - name: Trigger Netlify deploy
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        if: env.NETLIFY_BUILD_HOOK != ''
        run: curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
